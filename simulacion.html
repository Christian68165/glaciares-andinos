<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulación del Deshielo - Chacaltaya y Huayna Potosí</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />

    <style>
        /* CSS ESPECÍFICO DE ESTA PÁGINA */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Poppins", sans-serif;
            background-color: #0b0d13;
            color: #fff;
        }

        /* Contenedor del mapa: Debe ajustarse debajo del menú */
        #map {
            position: absolute;
            /* 🛑 AJUSTADO: El mapa empieza donde termina el menú (70px) 🛑 */
            top: 70px; 
            bottom: 0;
            width: 100%;
            height: calc(100% - 70px); /* Ocupa el resto de la altura */
        }
        
        /* Panel flotante de controles: Debe bajar para no chocar con el menú */
        #controls {
            position: absolute;
            /* 🛑 AJUSTADO: Bajamos los controles para que estén debajo del menú 🛑 */
            top: 90px; 
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100; /* Alto z-index para que esté sobre el mapa */
            width: 260px;
            /* ... (resto de estilos de #controls) ... */
        }
        
        /* Botón de volver (Eliminado y reemplazado por el menú de navegación) */
        #back-btn {
            display: none; /* Ocultamos el botón de volver ya que tienes el menú */
        }
        
        /* Aseguramos que el resto de los estilos del #controls y sus elementos se mantengan */
        #controls h2 { margin: 0 0 10px; font-size: 18px; color: #4fc3f7; text-align: center; }
        /* ... [continúa con el resto de tus estilos dentro de la etiqueta <style>] ... */
        /* HE OMITIDO EL RESTO DE TUS ESTILOS EN <style> POR BREVEDAD, PERO DEBEN QUEDAR */
    </style>
</head>

<body>
    <header id="navbar">
        <div class="logo">
            <a href="index.html">Glaciares Andinos 🏔️</a> 
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="mapa.html">Mapa Interactivo 🗺</a></li> 
                <li class="active"><a href="simulacion.html">Simulación de Deshielo 🧊</a></li>
                <li><a href="datos.html">Datos y Deshielo</a></li>
                <li><a href="impacto.html">Impacto Ambiental</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="index.html#galeria">Galería</a></li>
                
            </ul>
        </nav>
        <button class="menu-toggle">☰</button>
    </header>

    <div id="map"></div>

    <div id="controls">
        <h2>🧊 Simulación del Deshielo</h2>

        <label for="glacierSelect">Montaña:</label>
        <select id="glacierSelect">
            <option value="chacaltaya">Chacaltaya</option>
            <option value="huayna_potosi">Huayna Potosí</option> 
        </select>

        <label for="yearSlider">Año:</label>
        <input type="range" id="yearSlider" min="1990" max="2020" step="1" value="1990">
        <span id="yearLabel">1990</span>

        <button id="playBtn">▶ Reproducir</button>
        <button id="pauseBtn">⏸ Pausar</button>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="simulacion.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('#navbar nav');

            if (menuToggle && nav) {
                menuToggle.addEventListener('click', () => {
                    // Alterna la clase 'nav-open' en el contenedor <nav>
                    nav.classList.toggle('nav-open');
                });
            }
        });
    </script>
</body>
</html>
